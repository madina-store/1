                    <div class="game-card">
                        <div class="game-cover-container" onclick="openModal(${game.id})">
                            <img src="${game.cover}" class="game-cover" alt="${game.title}" loading="lazy">
                            <span class="platform-tag">${game.platform.toUpperCase()}</span>
                            ${game.arabic ? '<span class="arabic-tag"><i class="fa-solid fa-check"></i> تدعم العربية</span>' : ''}
                        </div>
                        <div class="game-info">
                            <div class="game-title" onclick="openModal(${game.id})">${game.title}</div>
                            <div class="game-meta"><i class="fa-solid fa-hard-drive"></i> ${game.size}</div>
                            <a href="${waUrl}" target="_blank" class="whatsapp-btn"><i class="fa-brands fa-whatsapp"></i> طلب عبر الواتساب</a>
                            <button class="detail-trigger" onclick="openModal(${game.id})"><i class="fa-solid fa-circle-info"></i> عرض التفاصيل بالفيديو</button>
                        </div>
                    </div>`;
            });

            // Render Pagination Buttons if more than 1 page
            if(totalPages > 1) {
                let paginationHTML = `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})"><i class="fa-solid fa-chevron-right"></i> السابقة</button>`;
                
                for(let i = 1; i <= totalPages; i++) {
                    paginationHTML += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                }
                
                paginationHTML += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">التالية <i class="fa-solid fa-chevron-left"></i></button>`;
                paginationContainer.innerHTML = paginationHTML;
            }
        }

        function changePage(page) {
            currentPage = page;
            renderGames();
            window.scrollTo({ top: 300, behavior: 'smooth' });
        }

        function openModal(id) {
            const game = gamesList.find(g => g.id === id);
            if(!game) return;
            document.getElementById('modalTitle').innerText = game.title;
            document.getElementById('modalPlatform').innerText = game.platform.toUpperCase();
            document.getElementById('modalSize').innerText = game.size;
            document.getElementById('modalVideo').src = game.video;
            document.getElementById('modalWaBtn').href = `https://wa.me/9647858858844?text=${encodeURIComponent(`السلام عليكم، أريد طلب لعبة ${game.title}`)}`;
            document.getElementById('modalGallery').innerHTML = `<img src="${game.cover}" class="gallery-img"><img src="${game.cover}" class="gallery-img">`;
            document.getElementById('gameModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('gameModal').classList.remove('active');
            document.getElementById('modalVideo').src = "";
        }

        function toggleAdmin() {
            const box = document.getElementById('adminPanelBox');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }

        function addGame() {
            const title = document.getElementById('newTitle').value;
            const platform = document.getElementById('newPlatform.value') || document.getElementById('newPlatform').value;
            const size = document.getElementById('newSize').value || "~35 GB";
            const cover = document.getElementById('newCover').value || "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500";
            const arabic = document.getElementById('newArabic').checked;

            if(!title) { alert("أدخل اسم اللعبة!"); return; }
            gamesList.unshift({ id: Date.now(), title, platform, size, arabic, cover, video: "https://www.youtube.com/embed/aOGgx3k9bQQ" });
            localStorage.setItem('madina_games', JSON.stringify(gamesList));
            document.getElementById('newTitle').value = '';
            toggleAdmin();
            currentPage = 1;
            renderGames();
            alert("تمت إضافة اللعبة بنجاح!");
        }

        renderGames();
    </script>
</body>
</html>
