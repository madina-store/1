<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر المدينة | Madina Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131a2a;
            --card-border: #1e293b;
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger-color: #ef4444;
            --edit-color: #3b82f6;
            --whatsapp-color: #25d366;
            --radius-lg: 16px;
            --radius-md: 10px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding-bottom: 120px; overflow-x: hidden; }
        
        header { background: rgba(11, 15, 25, 0.95); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--card-border); padding: 12px 16px; }
        .header-container { max-width: 600px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        .brand-info { display: flex; align-items: center; gap: 10px; }
        .logo-box { width: 44px; height: 44px; border-radius: 12px; overflow: hidden; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); display: flex; align-items: center; justify-content: center; font-size: 22px; color: #000; box-shadow: 0 0 15px rgba(0, 242, 254, 0.4); }
        .logo-img { width: 100%; height: 100%; object-fit: cover; }
        .brand-text h1 { font-size: 1.1rem; font-weight: 900; background: linear-gradient(to left, #fff, var(--accent-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .location-badge { font-size: 0.72rem; color: var(--accent-cyan); display: flex; align-items: center; gap: 4px; }
        .manage-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); color: var(--text-muted); padding: 8px 12px; border-radius: var(--radius-md); font-size: 0.8rem; cursor: pointer; }

        /* شريط البحث العلوي المتفاعل المضيء */
        .search-box { max-width: 600px; margin: 15px auto; padding: 0 16px; position: relative; }
        .search-box i { position: absolute; right: 28px; top: 50%; transform: translateY(-50%); color: var(--accent-cyan); }
        .search-input { width: 100%; padding: 12px 40px 12px 14px; background: var(--card-bg); border: 2px solid rgba(0, 242, 254, 0.4); border-radius: var(--radius-md); color: #fff; font-size: 0.9rem; outline: none; box-shadow: 0 0 12px rgba(0, 242, 254, 0.15); transition: 0.3s; }
        .search-input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 20px rgba(0, 242, 254, 0.35); }

        /* قسم السلايدر البانر العلوي */
        .hero-slider-container { max-width: 600px; margin: 0 auto 20px; padding: 0 16px; }
        .hero-slide-card { position: relative; border-radius: var(--radius-lg); overflow: hidden; background: var(--card-bg); border: 1px solid var(--card-border); min-height: 380px; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .hero-bg-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.45; z-index: 1; }
        .hero-gradient-overlay { position: absolute; inset: 0; background: linear-gradient(to top, #0b0f19 10%, rgba(11,15,25,0.7) 50%, rgba(11,15,25,0.2) 100%); z-index: 2; }
        .hero-content { position: relative; z-index: 3; }
        .hero-tag-badge { display: inline-flex; align-items: center; gap: 5px; background: rgba(0, 242, 254, 0.15); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); font-size: 0.72rem; font-weight: 900; padding: 4px 12px; border-radius: 20px; margin-bottom: 10px; }
        .hero-game-title { font-size: 1.5rem; font-weight: 900; color: #fff; margin-bottom: 8px; line-height: 1.2; }
        .hero-game-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px; align-items: center; }
        .hero-game-meta span { color: #fff; font-weight: 700; }
        .hero-desc-preview { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
        .hero-actions { display: flex; gap: 10px; margin-bottom: 15px; }
        .hero-btn-trailer { flex: 1; background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan)); color: #000; border: none; padding: 10px; border-radius: var(--radius-md); font-weight: 900; font-size: 0.82rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .hero-btn-details { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 10px; border-radius: var(--radius-md); font-weight: 700; font-size: 0.82rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        
        .hero-thumbs-row { display: flex; gap: 8px; overflow-x: auto; padding-top: 5px; }
        .hero-thumb { width: 45px; height: 45px; border-radius: 8px; overflow: hidden; border: 2px solid transparent; cursor: pointer; opacity: 0.5; transition: 0.3s; flex-shrink: 0; }
        .hero-thumb.active { border-color: var(--accent-cyan); opacity: 1; transform: scale(1.05); }
        .hero-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .hero-progress-bar { width: 100%; height: 3px; background: rgba(255,255,255,0.2); border-radius: 2px; margin-top: 10px; overflow: hidden; }
        .hero-progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan)); transition: width 0.1s linear; }

        /* الأقسام والفلترة */
        .filter-section { max-width: 600px; margin: 0 auto 15px; padding: 0 16px; }
        .platforms-container { display: flex; gap: 8px; margin-bottom: 10px; }
        .plat-btn { flex: 1; padding: 10px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-md); color: var(--text-muted); font-weight: 700; font-size: 0.85rem; cursor: pointer; text-align: center; transition: 0.2s; }
        .plat-btn.active { background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan)); color: #000; border-color: transparent; box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3); }

        .categories-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-chip { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted); padding: 6px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 700; white-space: nowrap; cursor: pointer; transition: 0.2s; }
        .cat-chip.active { background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan)); color: #000; border-color: transparent; box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3); }

        /* شبكة الألعاب */
        .games-grid { max-width: 600px; margin: 0 auto; padding: 0 16px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .game-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .game-cover-container { width: 100%; aspect-ratio: 3/4; background: #060911; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; }
        .game-cover { width: 100%; height: 100%; object-fit: cover; }
        
        .platform-tag { position: absolute; bottom: 8px; left: 8px; background: rgba(0, 0, 0, 0.75); color: var(--accent-cyan); font-size: 0.65rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; border: 1px solid rgba(0, 242, 254, 0.3); }
        
        .add-cart-btn { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; background: rgba(0, 0, 0, 0.75); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.85rem; transition: 0.2s; z-index: 5; }
        .game-card.selected .add-cart-btn { background: var(--accent-cyan); color: #000; border-color: var(--accent-cyan); }

        .game-info { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; cursor: pointer; }
        .game-title { font-size: 0.85rem; font-weight: 700; color: var(--text-main); margin-bottom: 6px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 2.6em; }
        
        .game-meta-bottom { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; }
        .game-size { font-weight: 900; color: var(--accent-cyan); font-size: 0.95rem; }
        .arabic-support { font-size: 0.75rem; color: #10b981; font-weight: 700; margin-top: 5px; display: flex; align-items: center; gap: 4px; }

        /* شريط السلة العائم السفلي */
        .cart-floating-bar { position: fixed; bottom: 15px; left: 16px; right: 16px; max-width: 568px; margin: 0 auto; background: #182238; border: 1px solid var(--accent-cyan); border-radius: var(--radius-lg); padding: 12px 16px; display: none; align-items: center; justify-content: space-between; z-index: 500; box-shadow: 0 10px 25px rgba(0,0,0,0.6); animation: slideUp 0.3s ease; }
        .cart-floating-bar.active { display: flex; }
        @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .cart-info-text { font-size: 0.82rem; font-weight: 700; color: #fff; }
        .cart-actions { display: flex; gap: 8px; }
        .btn-clear { background: rgba(239, 68, 68, 0.2); color: var(--danger-color); border: 1px solid rgba(239, 68, 68, 0.4); padding: 8px 12px; border-radius: var(--radius-md); font-size: 0.75rem; cursor: pointer; font-weight: 700; }
        .btn-send-wa { background: var(--whatsapp-color); color: #fff; border: none; padding: 8px 14px; border-radius: var(--radius-md); font-size: 0.78rem; cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: 5px; text-decoration: none; }

        /* تذييل الصفحة الفخم */
        .store-footer { max-width: 600px; margin: 40px auto 20px; padding: 30px 20px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-lg); text-align: center; }
        .footer-logo { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #000; box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); }
        .footer-store-name { font-size: 1.25rem; font-weight: 900; margin-bottom: 20px; color: #fff; letter-spacing: 0.5px; }
        
        .footer-info-row { margin-bottom: 16px; }
        .footer-label { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 500; }
        .footer-value-group { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .footer-val { font-size: 1.1rem; font-weight: 900; color: #fff; letter-spacing: 0.5px; }
        
        .footer-wa-icon-btn { background: var(--whatsapp-color); color: #fff; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 1.2rem; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4); transition: 0.2s; }
        .footer-wa-icon-btn:hover { transform: scale(1.08); }

        .map-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: rgba(0, 242, 254, 0.1); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); padding: 11px 20px; border-radius: var(--radius-md); font-weight: 700; font-size: 0.9rem; text-decoration: none; width: 100%; margin-top: 12px; transition: 0.2s; }
        .map-btn:hover { background: var(--accent-cyan); color: #000; }

        /* نافذة تفاصيل اللعبة */
        .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(10px); z-index: 1000; display: none; align-items: flex-end; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-color); border-top: 1px solid var(--card-border); width: 100%; max-width: 600px; max-height: 92vh; border-radius: 24px 24px 0 0; overflow-y: auto; position: relative; padding-bottom: 30px; }
        .modal-close { position: absolute; left: 15px; top: 15px; background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255,255,255,0.2); color: #fff; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; font-size: 1.1rem; }
        
        .modal-video-container { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
        .modal-video-container iframe { width: 100%; height: 100%; border: none; }

        .modal-body-padding { padding: 20px; }
        .modal-title { font-size: 1.4rem; font-weight: 900; margin-bottom: 8px; color: #fff; }
        .modal-badges-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; font-size: 0.78rem; }
        .modal-badge-item { background: var(--card-bg); border: 1px solid var(--card-border); padding: 5px 12px; border-radius: 8px; color: var(--text-muted); font-weight: 700; }
        
        .modal-section-heading { font-size: 0.95rem; font-weight: 900; color: #fff; margin: 20px 0 10px; display: flex; align-items: center; gap: 6px; }
        .modal-desc { font-size: 1.02rem; color: #cbd5e1; line-height: 1.8; font-weight: 500; background: rgba(255,255,255,0.02); padding: 15px; border-radius: var(--radius-md); border: 1px solid var(--card-border); margin-bottom: 20px; }
        
        .gallery-stack { display: flex; flex-direction: column; gap: 12px; }
        .gallery-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: var(--radius-md); border: 1px solid var(--card-border); cursor: pointer; transition: 0.2s; }
        .gallery-img:hover { opacity: 0.9; }

        /* مكبر الصور التفاعلي بالأسهم */
        .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
        .lightbox.active { display: flex; }
        .lightbox-img-wrapper { position: relative; width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: center; }
        .lightbox img { max-width: 100%; max-height: 80vh; border-radius: 10px; object-fit: contain; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        
        .lightbox-close { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 24px; cursor: pointer; background: rgba(255,255,255,0.15); width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 2010; border: none; }
        
        .lightbox-nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 255, 255, 0.25); color: #fff; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; z-index: 2010; transition: 0.2s; }
        .lightbox-nav-btn:hover { background: var(--accent-cyan); color: #000; border-color: var(--accent-cyan); }
        .lightbox-prev { right: 10px; }
        .lightbox-next { left: 10px; }
        
        .lightbox-counter { margin-top: 15px; color: var(--text-muted); font-size: 0.9rem; font-weight: 700; background: rgba(255,255,255,0.08); padding: 5px 15px; border-radius: 20px; }

        .admin-panel { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-lg); padding: 15px; margin: 15px auto; max-width: 600px; display: none; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 0.78rem; margin-bottom: 3px; color: var(--text-muted); }
        .form-control { width: 100%; padding: 8px; background: var(--bg-color); border: 1px solid var(--card-border); border-radius: 6px; color: #fff; font-size: 0.85rem; }
        .admin-game-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 6px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 0.8rem; border: 1px solid var(--card-border); }
        .admin-btns-group { display: flex; gap: 5px; }
        .delete-mini-btn { background: rgba(239, 68, 68, 0.2); color: var(--danger-color); border: 1px solid rgba(239, 68, 68, 0.4); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
        .edit-mini-btn { background: rgba(59, 130, 246, 0.2); color: var(--edit-color); border: 1px solid rgba(59, 130, 246, 0.4); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="brand-info">
                <div class="logo-box" id="headerLogo">
                    <i class="fa-solid fa-gamepad"></i>
                </div>
                <div class="brand-text">
                    <h1>متجر المدينة</h1>
                    <div class="location-badge"><i class="fa-solid fa-location-dot"></i> ذي قار - قضاء النصر</div>
                </div>
            </div>
            <button class="manage-btn" onclick="toggleAdmin()"><i class="fa-solid fa-gear"></i> إدارة</button>
        </div>
    </header>

    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن لعبة، مطور..." oninput="renderGames()">
    </div>

    <!-- قسم السلايدر البانر العلوي -->
    <div class="hero-slider-container" id="heroSliderContainer"></div>

    <!-- الأقسام والفلترة مع العدادات -->
    <div class="filter-section">
        <div class="platforms-container">
            <button class="plat-btn active" onclick="setPlatform('all')">الكل</button>
            <button class="plat-btn" onclick="setPlatform('ps4')">PS4</button>
            <button class="plat-btn" onclick="setPlatform('ps5')">PS5</button>
        </div>
        <div class="categories-scroll" id="categoriesContainer"></div>
    </div>

    <!-- لوحة التحكم للإدارة -->
    <div class="admin-panel" id="adminPanelBox">
        <h3 id="adminFormTitle" style="font-size:0.9rem; color:var(--accent-cyan); margin-bottom:12px;"><i class="fa-solid fa-sliders"></i> لوحة تحكم المتجر</h3>
        
        <div class="form-group"><label>تغيير شعار المتجر (من الاستوديو)</label></div>
        <div class="form-group"><input type="file" id="logoFileInput" class="form-control" accept="image/*"></div>
        <button onclick="updateLogo()" class="map-btn" style="margin-bottom:15px; background:var(--accent-cyan); color:#000;"><i class="fa-solid fa-upload"></i> حفظ وتحديث الشعار</button>

        <input type="hidden" id="editGameId" value="">
        <div class="form-group"><label>إضافة / تعديل لعبة</label></div>
        <div class="form-group"><input type="text" id="newTitle" class="form-control" placeholder="اسم اللعبة"></div>
        <div style="display:flex; gap:8px;">
            <div class="form-group" style="flex:1;"><select id="newPlatform" class="form-control"><option value="ps4">PS4</option><option value="ps5">PS5</option></select></div>
            <div class="form-group" style="flex:1;"><select id="newCategory" class="form-control"><option value="مغامرات">مغامرات</option><option value="حركة">حركة</option><option value="تصويب">تصويب</option><option value="عالم مفتوح">عالم مفتوح</option><option value="تقمص الأدوار">تقمص الأدوار</option><option value="رعب">رعب</option><option value="تسلل">تسلل</option><option value="قتال">قتال</option></select></div>
        </div>
        <div class="form-group"><input type="text" id="newSize" class="form-control" placeholder="الحجم (مثال: 35 أو 35 GB)"></div>
        <div class="form-group"><input type="text" id="newCover" class="form-control" placeholder="رابط غلاف اللعبة..."></div>
        <div class="form-group"><input type="text" id="newVideo" class="form-control" placeholder="رابط يوتيوب التريلر..."></div>
        
        <div class="form-group">
            <label>روابط لقطات الشاشة (حد أقصى 4 صور - ضع كل رابط في سطر):</label>
            <textarea id="newScreenshots" class="form-control" rows="3" placeholder="https://link1.jpg&#10;https://link2.jpg"></textarea>
        </div>

        <div class="form-group"><textarea id="newDesc" class="form-control" rows="2" placeholder="وصف اللعبة..."></textarea></div>
        
        <div class="form-group">
            <label>حالة دعم اللغة العربية:</label>
            <select id="newArabicStatus" class="form-control">
                <option value="لا تدعم">لا تدعم العربية</option>
                <option value="تدعم اللغة العربية (ترجمة)">تدعم اللغة العربية (ترجمة)</option>
                <option value="تدعم اللغة العربية (دبلجة)">تدعم اللغة العربية (دبلجة)</option>
            </select>
        </div>

        <button id="saveGameBtn" onclick="saveGameData()" class="map-btn" style="background:var(--accent-cyan); color:#000;"><i class="fa-solid fa-save"></i> حفظ ونشر اللعبة</button>
        <button id="cancelEditBtn" onclick="resetAdminForm()" class="map-btn" style="background:rgba(239,68,68,0.2); color:var(--danger-color); display:none; margin-top:5px;">إلغاء التعديل</button>

        <h3 style="font-size:0.85rem; color:var(--danger-color); margin: 15px 0 8px;">إدارة وحذف الألعاب</h3>
        <div id="adminGamesList" style="max-height: 150px; overflow-y: auto;"></div>
    </div>

    <!-- شبكة عرض الألعاب -->
    <main class="games-grid" id="gamesGrid"></main>

    <!-- شريط سلة التسوق العائم السفلي -->
    <div class="cart-floating-bar" id="cartBar">
        <div class="cart-info-text" id="cartInfoText">0 ألعاب محددة الإجمالي: 0 GB</div>
        <div class="cart-actions">
            <button class="btn-clear" onclick="clearCart()">مسح</button>
            <a id="cartWhatsAppBtn" href="#" target="_blank" class="btn-send-wa"><i class="fa-brands fa-whatsapp"></i> إرسال الطلب</a>
        </div>
    </div>

    <!-- تذييل الصفحة الفخم -->
    <footer class="store-footer">
        <div class="footer-logo"><i class="fa-solid fa-gamepad"></i></div>
        <div class="footer-store-name">متجر المدينة</div>
        
        <div class="footer-info-row">
            <div class="footer-label">واتساب</div>
            <div class="footer-value-group">
                <span class="footer-val">07858858844</span>
                <a href="https://wa.me/9647858858844?text=السلام%20عليكم" target="_blank" class="footer-wa-icon-btn">
                    <i class="fa-brands fa-whatsapp"></i>
                </a>
            </div>
        </div>

        <div class="footer-info-row">
            <div class="footer-label">العنوان</div>
            <div class="footer-value-group">
                <span class="footer-val"><i class="fa-solid fa-location-dot" style="color: var(--accent-cyan); margin-left: 6px;"></i> ذي قار - قضاء النصر</span>
            </div>
        </div>

        <a href="https://maps.app.goo.gl/5y1AmnQqyYhpeQjH8?g_st=ac" target="_blank" class="map-btn">
            <i class="fa-solid fa-map-location-dot"></i> افتح في خرائط Google
        </a>
        <div style="font-size:0.7rem; color:var(--text-muted); margin-top:15px;">&copy; متجر المدينة - جميع الحقوق محفوظة</div>
    </footer>

    <!-- نافذة تفاصيل اللعبة -->
    <div class="modal" id="gameModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            
            <div class="modal-video-container">
                <iframe id="modalVideo" src="" allowfullscreen></iframe>
            </div>

            <div class="modal-body-padding">
                <h3 class="modal-title" id="modalTitle"></h3>
                <div class="modal-badges-row">
                    <span class="modal-badge-item" id="modalPlatform"></span>
                    <span class="modal-badge-item" id="modalCategory"></span>
                    <span class="modal-badge-item" id="modalSizeBadge"></span>
                </div>

                <div class="modal-section-heading"><i class="fa-solid fa-circle-info" style="color: var(--accent-cyan);"></i> عن اللعبة</div>
                <div class="modal-desc" id="modalDesc"></div>

                <div class="modal-section-heading" id="screenshotsHeading"><i class="fa-solid fa-images" style="color: var(--accent-cyan);"></i> لقطات الشاشة</div>
                <div class="gallery-stack" id="modalGallery"></div>
            </div>
        </div>
    </div>

    <!-- مكبر الصور التفاعلي بالأسهم -->
    <div class="lightbox" id="lightboxModal" onclick="closeLightboxOnBg(event)">
        <button class="lightbox-close" onclick="closeLightbox()"><i class="fa-solid fa-xmark"></i></button>
        
        <div class="lightbox-img-wrapper">
            <button class="lightbox-nav-btn lightbox-prev" onclick="changeLightboxSlide(-1, event)" title="السابق">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
            
            <img id="lightboxImg" src="" alt="Fullscreen">
            
            <button class="lightbox-nav-btn lightbox-next" onclick="changeLightboxSlide(1, event)" title="التالي">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
        </div>

        <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>
    </div>

    <script>
        const defaultGames = [
            { id: 1, title: "God of War Ragnarok", platform: "ps5", category: "مغامرات", size: "84.5 GB", arabicStatus: "تدعم اللغة العربية (دبلجة)", cover: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500", video: "https://www.youtube.com/embed/EE-4GvjKcfs", desc: "رحلة ملحمية لكراتوس وأتروس في عوالم الأساطير الإسكندنافية لمواجهة المعارك المصيرية.", screenshots: ["https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=800", "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=800"] },
            { id: 2, title: "Assassin's Creed Mirage", platform: "ps4", category: "عالم مفتوح", size: "35.2 GB", arabicStatus: "تدعم اللغة العربية (ترجمة)", cover: "https://m.media-amazon.com/images/I/71N1C-8jU1L._SL1500_.jpg", video: "https://www.youtube.com/embed/9w66x5x5Z1M", desc: "عش مغامرة باسم في شوارع بغداد التاريخية الخلابة واستكشف أسرار القتلة.", screenshots: ["https://m.media-amazon.com/images/I/71N1C-8jU1L._SL1500_.jpg"] },
            { id: 3, title: "Elden Ring", platform: "ps5", category: "تقمص الأدوار", size: "45.0 GB", arabicStatus: "لا تدعم", cover: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=500", video: "https://www.youtube.com/embed/AKX3MRWZgbI", desc: "عالم مفتوح شاسع وتحديات قوية بانتظارك لتصبح ملك الأسرار.", screenshots: ["https://images.unsplash.com/photo-1511512578047-dfb367046420?w=800"] }
        ];

        let gamesList = [];
        try {
            gamesList = JSON.parse(localStorage.getItem('madina_games')) || defaultGames;
            if (!Array.isArray(gamesList)) gamesList = defaultGames;
        } catch(e) {
            gamesList = defaultGames;
            localStorage.setItem('madina_games', JSON.stringify(defaultGames));
        }

        let selectedPlatform = 'all';
        let selectedCategory = 'all';
        
        let cart = [];
        try {
            cart = JSON.parse(localStorage.getItem('madina_cart')) || [];
            if (!Array.isArray(cart)) cart = [];
        } catch(e) { cart = []; }

        const configKey = "AFC24";
        const categoriesList = ["الكل", "مغامرات", "حركة", "تصويب", "عالم مفتوح", "تقمص الأدوار", "رعب", "تسلل", "قتال"];

        let currentGalleryImages = [];
        let currentLightboxIndex = 0;
        let currentHeroIndex = 0;
        let heroTimer = null;

        function initHeroSlider() {
            try {
                const container = document.getElementById('heroSliderContainer');
                if (!container || gamesList.length === 0) return;

                const latestGames = gamesList.slice(0, 4);
                
                function renderHero(index) {
                    currentHeroIndex = index;
                    const game = latestGames[index];
                    let gameSize = game.size || "30 GB";
                    if (!gameSize.toUpperCase().includes('GB')) gameSize += ' GB';

                    let thumbsHtml = '';
                    latestGames.forEach((g, idx) => {
                        thumbsHtml += `
                            <div class="hero-thumb ${idx === index ? 'active' : ''}" onclick="switchHero(${idx})">
                                <img src="${g.cover || ''}" alt="thumb" onerror="this.src='https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500'">
                            </div>`;
                    });

                    container.innerHTML = `
                        <div class="hero-slide-card">
                            <img src="${game.cover || ''}" class="hero-bg-img" alt="bg" onerror="this.src='https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500'">
                            <div class="hero-gradient-overlay"></div>
                            <div class="hero-content">
                                <span class="hero-tag-badge"><i class="fa-solid fa-sparkles"></i> أُضيف حديثاً</span>
                                <div class="hero-game-title">${game.title || 'لعبة'}</div>
                                <div class="hero-game-meta">
                                    <span>${(game.platform || 'ps4').toUpperCase()}</span> • <span>${game.category || 'عام'}</span> • <span>${gameSize}</span>
                                </div>
                                <div class="hero-desc-preview">${game.desc || "متوفر الآن في متجر المدينة بأعلى جودة."}</div>
                                <div class="hero-actions">
                                    <button class="hero-btn-trailer" onclick="openModal(${game.id})"><i class="fa-solid fa-play"></i> شاهد المقطع</button>
                                    <button class="hero-btn-details" onclick="openModal(${game.id})"><i class="fa-solid fa-circle-info"></i> التفاصيل</button>
                                </div>
                                <div class="hero-thumbs-row">${thumbsHtml}</div>
                                <div class="hero-progress-bar"><div class="hero-progress-fill" id="heroProgress"></div></div>
                            </div>
                        </div>`;
                    
                    startHeroTimer();
                }

                window.switchHero = function(idx) {
                    clearInterval(heroTimer);
                    renderHero(idx);
                };

                function startHeroTimer() {
                    let progress = 0;
                    const fill = document.getElementById('heroProgress');
                    if(!fill) return;
                    
                    clearInterval(heroTimer);
                    heroTimer = setInterval(() => {
                        progress += 2;
                        fill.style.width = progress + '%';
                        if (progress >= 100) {
                            clearInterval(heroTimer);
                            let nextIdx = (currentHeroIndex + 1) % latestGames.length;
                            renderHero(nextIdx);
                        }
                    }, 100);
                }

                renderHero(0);
            } catch(err) {
                console.error("Hero Slider Error:", err);
            }
        }

        function applySavedLogo() {
            try {
                const savedLogo = localStorage.getItem('madina_logo');
                if (savedLogo) {
                    document.getElementById('headerLogo').innerHTML = `<img src="${savedLogo}" class="logo-img" alt="logo">`;
                }
            } catch(e) {}
        }
        applySavedLogo();

        function updateLogo() {
            const fileInput = document.getElementById('logoFileInput');
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        localStorage.setItem('madina_logo', e.target.result);
                        applySavedLogo();
                        alert("تم تحديث الشعار بنجاح!");
                    } catch(err) {
                        alert("حجم الصورة كبير جداً، يرجى اختيار صورة أصغر.");
                    }
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                alert("يرجى اختيار صورة أولاً!");
            }
        }

        function toggleAdmin() {
            try {
                const box = document.getElementById('adminPanelBox');
                if (!box) return;
                if (box.style.display !== 'block') {
                    const enteredPass = prompt("أدخل رمز الإدارة:");
                    if (!enteredPass || enteredPass.trim() !== configKey) {
                        alert("الرمز غير صحيح!");
                        return;
                    }
                }
                box.style.display = box.style.display === 'block' ? 'none' : 'block';
                if (box.style.display === 'block') {
                    resetAdminForm();
                    renderAdminGamesList();
                }
            } catch(e) {
                console.error(e);
            }
        }

        function setPlatform(plat) {
            selectedPlatform = plat;
            document.querySelectorAll('.plat-btn').forEach(b => b.classList.remove('active'));
            if(event && event.target) event.target.classList.add('active');
            renderGames();
        }

        function setCategory(cat) {
            selectedCategory = cat;
            renderCategories();
            renderGames();
        }

        function renderCategories() {
            try {
                const container = document.getElementById('categoriesContainer');
                if (!container) return;
                container.innerHTML = '';

                const platformFiltered = gamesList.filter(g => selectedPlatform === 'all' || g.platform === selectedPlatform);

                categoriesList.forEach(cat => {
                    let count = 0;
                    if (cat === 'الكل') {
                        count = platformFiltered.length;
                    } else {
                        count = platformFiltered.filter(g => g.category === cat).length;
                    }

                    const isActive = (selectedCategory === (cat === 'الكل' ? 'all' : cat));
                    container.innerHTML += `
                        <button class="cat-chip ${isActive ? 'active' : ''}" onclick="setCategory('${cat === 'الكل' ? 'all' : cat}')">
                            ${cat} (${count})
                        </button>`;
                });
            } catch(e) {}
        }

        function toggleCart(id, event) {
            if(event) event.stopPropagation();
            const game = gamesList.find(g => g.id === id);
            if (!game) return;

            const index = cart.findIndex(item => item.id === id);
            if (index > -1) {
                cart.splice(index, 1);
            } else {
                cart.push(game);
            }
            try {
                localStorage.setItem('madina_cart', JSON.stringify(cart));
            } catch(e) {}
            renderGames();
            updateCartBar();
        }

        function updateCartBar() {
            try {
                const bar = document.getElementById('cartBar');
                if (!bar) return;
                if (cart.length === 0) {
                    bar.classList.remove('active');
                    return;
                }
                bar.classList.add('active');
                
                let totalGb = 0;
                cart.forEach(item => {
                    let sizeStr = item.size ? item.size.replace(/[^0-9.]/g, '') : "0";
                    let num = parseFloat(sizeStr);
                    if (!isNaN(num)) totalGb += num;
                });

                document.getElementById('cartInfoText').innerText = `${cart.length} ألعاب محددة الإجمالي: ${totalGb.toFixed(1)} GB`;
                
                let msg = "السلام عليكم، أريد طلب الألعاب الآتية:\n" + cart.map(i => `- ${i.title} (${(i.platform || '').toUpperCase()} - ${i.size})`).join("\n");
                document.getElementById('cartWhatsAppBtn').href = `https://wa.me/9647858858844?text=${encodeURIComponent(msg)}`;
            } catch(e) {}
        }

        function clearCart() {
            cart = [];
            try {
                localStorage.setItem('madina_cart', JSON.stringify(cart));
            } catch(e) {}
            renderGames();
            updateCartBar();
        }

        function formatYouTubeUrl(url) {
            if (!url) return "https://www.youtube.com/embed/aOGgx3k9bQQ";
            if (url.includes('embed/')) return url;
            let videoId = '';
            if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1].split('?')[0];
            } else if (url.includes('watch?v=')) {
                videoId = url.split('watch?v=').length > 1 ? url.split('watch?v=')[1].split('&')[0] : '';
            }
            return videoId ? `https://www.youtube.com/embed/${videoId}` : url;
        }

        function renderGames() {
            try {
                renderCategories();
                initHeroSlider();
                const grid = document.getElementById('gamesGrid');
                const searchInput = document.getElementById('searchInput');
                const search = searchInput ? searchInput.value.toLowerCase() : '';
                if (!grid) return;
                grid.innerHTML = '';

                const filtered = gamesList.filter(g => {
                    const matchPlat = (selectedPlatform === 'all' || g.platform === selectedPlatform);
                    const matchCat = (selectedCategory === 'all' || g.category === selectedCategory);
                    const titleStr = g.title ? g.title.toLowerCase() : '';
                    const matchSearch = titleStr.includes(search);
                    return matchPlat && matchCat && matchSearch;
                });

                if (filtered.length === 0) {
                    grid.innerHTML = `<div style="grid-column:span 2; text-align:center; padding:40px; color:var(--text-muted);">لا توجد ألعاب مطابقة.</div>`;
                    updateCartBar();
                    return;
                }

                filtered.forEach(game => {
                    const isSelected = cart.some(item => item.id === game.id);
                    
                    let arabicHtml = '';
                    let status = game.arabicStatus || '';
                    if (status && status !== 'لا تدعم' && status !== '') {
                        arabicHtml = `<div class="arabic-support"><i class="fa-solid fa-check"></i> ${status}</div>`;
                    }

                    let gameSize = game.size || "30 GB";
                    if (!gameSize.toUpperCase().includes('GB')) {
                        gameSize += ' GB';
                    }

                    grid.innerHTML += `
                        <div class="game-card ${isSelected ? 'selected' : ''}">
                            <div class="game-cover-container" onclick="openModal(${game.id})">
                                <img src="${game.cover || ''}" class="game-cover" alt="${game.title || ''}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500'">
                                <span class="platform-tag">${(game.platform || 'ps4').toUpperCase()}</span>
                                <button class="add-cart-btn" onclick="toggleCart(${game.id}, event)">
                                    <i class="fa-solid ${isSelected ? 'fa-check' : 'fa-plus'}"></i>
                                </button>
                            </div>
                            <div class="game-info" onclick="openModal(${game.id})">
                                <div class="game-title">${game.title || 'بدون اسم'}</div>
                                <div class="game-meta-bottom">
                                    <span class="game-size">${gameSize}</span>
                                    <span>${game.category || 'عام'}</span>
                                </div>
                                ${arabicHtml}
                            </div>
                        </div>`;
                });
                updateCartBar();
            } catch(err) {
                console.error("Render Games Error:", err);
            }
        }

        function openModal(id) {
            try {
                const game = gamesList.find(g => g.id === id);
                if (!game) return;

                let gameSize = game.size || "30 GB";
                if (!gameSize.toUpperCase().includes('GB')) gameSize += ' GB';

                document.getElementById('modalTitle').innerText = game.title || '';
                document.getElementById('modalPlatform').innerText = (game.platform || 'ps4').toUpperCase();
                document.getElementById('modalCategory').innerText = game.category || '';
                document.getElementById('modalSizeBadge').innerText = gameSize;
                document.getElementById('modalVideo').src = formatYouTubeUrl(game.video);
                document.getElementById('modalDesc').innerText = game.desc || "لا يوجد وصف متوفر لهذه اللعبة حالياً.";

                let imgs = [];
                if (game.screenshots && Array.isArray(game.screenshots) && game.screenshots.length > 0) {
                    imgs = game.screenshots.filter(url => url && url.trim() !== '');
                } else {
                    if (game.img1) imgs.push(game.img1);
                    if (game.img2) imgs.push(game.img2);
                    if (imgs.length === 0 && game.cover) imgs.push(game.cover);
                }
                
                currentGalleryImages = imgs;
                const galleryContainer = document.getElementById('modalGallery');
                galleryContainer.innerHTML = '';

                document.getElementById('screenshotsHeading').innerHTML = `<i class="fa-solid fa-images" style="color: var(--accent-cyan);"></i> لقطات الشاشة (${imgs.length}) - اضغط للتكبير والتقليب`;

                imgs.forEach((src, index) => {
                    galleryContainer.innerHTML += `
                        <img src="${src}" class="gallery-img" onclick="openLightbox(${index})" onerror="this.style.display='none'">`;
                });

                document.getElementById('gameModal').classList.add('active');
            } catch(e) {}
        }

        function closeModal() {
            try {
                document.getElementById('gameModal').classList.remove('active');
                document.getElementById('modalVideo').src = "";
            } catch(e) {}
        }

        function openLightbox(index) {
            try {
                if (!currentGalleryImages || currentGalleryImages.length === 0) return;
                currentLightboxIndex = index;
                updateLightboxDisplay();
                document.getElementById('lightboxModal').classList.add('active');
            } catch(e) {}
        }

        function updateLightboxDisplay() {
            try {
                const imgEl = document.getElementById('lightboxImg');
                const counterEl = document.getElementById('lightboxCounter');
                const navBtns = document.querySelectorAll('.lightbox-nav-btn');

                imgEl.src = currentGalleryImages[currentLightboxIndex];
                counterEl.innerText = `${currentLightboxIndex + 1} / ${currentGalleryImages.length}`;

                navBtns.forEach(btn => {
                    btn.style.display = currentGalleryImages.length > 1 ? 'flex' : 'none';
                });
            } catch(e) {}
        }

        function changeLightboxSlide(step, event) {
            if (event) event.stopPropagation();
            if (currentGalleryImages.length <= 1) return;

            currentLightboxIndex = (currentLightboxIndex + step + currentGalleryImages.length) % currentGalleryImages.length;
            updateLightboxDisplay();
        }

        function closeLightbox() {
            try {
                document.getElementById('lightboxModal').classList.remove('active');
            } catch(e) {}
        }

        function closeLightboxOnBg(event) {
            if (event.target.id === 'lightboxModal' || event.target.classList.contains('lightbox-img-wrapper')) {
                closeLightbox();
            }
        }

        function saveGameData() {
            try {
                const editId = document.getElementById('editGameId').value;
                const title = document.getElementById('newTitle').value.trim();
                const platform = document.getElementById('newPlatform').value;
                const category = document.getElementById('newCategory').value;
                let rawSize = document.getElementById('newSize').value.trim() || "30";
                const size = rawSize.toUpperCase().includes('GB') ? rawSize : rawSize + ' GB';
                const cover = document.getElementById('newCover').value.trim() || "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500";
                const video = formatYouTubeUrl(document.getElementById('newVideo').value.trim());
                const desc = document.getElementById('newDesc').value.trim();
                const arabicStatus = document.getElementById('newArabicStatus').value;

                const rawScreenshots = document.getElementById('newScreenshots').value.trim();
                let screenshots = [];
                if (rawScreenshots) {
                    screenshots = rawScreenshots
                        .split(/[\n,]+/)
                        .map(s => s.trim())
                        .filter(s => s !== '')
                        .slice(0, 4);
                }

                if (!title) { alert("أدخل اسم اللعبة!"); return; }

                if (editId) {
                    let game = gamesList.find(g => g.id == editId);
                    if (game) {
                        game.title = title;
                        game.platform = platform;
                        game.category = category;
                        game.size = size;
                        game.cover = cover;
                        game.video = video;
                        game.desc = desc;
                        game.arabicStatus = arabicStatus;
                        if(screenshots.length > 0) game.screenshots = screenshots;
                    }
                    alert("تم تحديث اللعبة بنجاح!");
                } else {
                    const newGame = { id: Date.now(), title, platform, category, size, cover, video, screenshots, desc, arabicStatus };
                    gamesList.unshift(newGame);
                    alert("تمت إضافة اللعبة ونشرها بنجاح!");
                }

                localStorage.setItem('madina_games', JSON.stringify(gamesList));
                resetAdminForm();
                renderGames();
                renderAdminGamesList();
            } catch(err) {
                alert("حدث خطأ أثناء الحفظ، تأكد من صحة الروابط المدخلة.");
            }
        }

        function editGame(id) {
            try {
                const game = gamesList.find(g => g.id == id);
                if (!game) return;

                document.getElementById('editGameId').value = game.id;
                document.getElementById('newTitle').value = game.title || '';
                document.getElementById('newPlatform').value = game.platform || 'ps4';
                document.getElementById('newCategory').value = game.category || 'مغامرات';
                document.getElementById('newSize').value = game.size || '';
                document.getElementById('newCover').value = game.cover || '';
                document.getElementById('newVideo').value = game.video || '';
                document.getElementById('newDesc').value = game.desc || '';
                document.getElementById('newArabicStatus').value = game.arabicStatus || 'لا تدعم';
                document.getElementById('newScreenshots').value = (game.screenshots && Array.isArray(game.screenshots)) ? game.screenshots.join('\n') : '';

                document.getElementById('adminFormTitle').innerHTML = `<i class="fa-solid fa-pen-to-square"></i> تعديل اللعبة: ${game.title}`;
                document.getElementById('saveGameBtn').innerHTML = `<i class="fa-solid fa-check"></i> حفظ التعديلات`;
                document.getElementById('cancelEditBtn').style.display = 'block';

                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch(e) {}
        }

        function resetAdminForm() {
            try {
                document.getElementById('editGameId').value = '';
                document.getElementById('newTitle').value = '';
                document.getElementById('newSize').value = '';
                document.getElementById('newCover').value = '';
                document.getElementById('newVideo').value = '';
                document.getElementById('newScreenshots').value = '';
                document.getElementById('newDesc').value = '';
                document.getElementById('newArabicStatus').value = 'لا تدعم';

                document.getElementById('adminFormTitle').innerHTML = `<i class="fa-solid fa-sliders"></i> لوحة تحكم المتجر`;
                document.getElementById('saveGameBtn').innerHTML = `<i class="fa-solid fa-save"></i> حفظ ونشر اللعبة`;
                document.getElementById('cancelEditBtn').style.display = 'none';
            } catch(e) {}
        }

        function renderAdminGamesList() {
            try {
                const list = document.getElementById('adminGamesList');
                if (!list) return;
                list.innerHTML = '';
                if (gamesList.length === 0) {
                    list.innerHTML = `<div style="font-size:0.75rem; color:var(--text-muted);">لا توجد ألعاب.</div>`;
                    return;
                }
                gamesList.forEach(g => {
                    list.innerHTML += `
                        <div class="admin-game-item">
                            <span>${g.title || ''} (${(g.platform || '').toUpperCase()})</span>
                            <div class="admin-btns-group">
                                <button class="edit-mini-btn" onclick="editGame(${g.id})">تعديل</button>
                                <button class="delete-mini-btn" onclick="deleteGame(${g.id})">حذف</button>
                            </div>
                        </div>`;
                });
            } catch(e) {}
        }

        function deleteGame(id) {
            if (confirm("هل تريد حذف اللعبة؟")) {
                gamesList = gamesList.filter(g => g.id !== id);
                cart = cart.filter(item => item.id !== id);
                try {
                    localStorage.setItem('madina_games', JSON.stringify(gamesList));
                    localStorage.setItem('madina_cart', JSON.stringify(cart));
                } catch(e) {}
                resetAdminForm();
                renderGames();
                renderAdminGamesList();
            }
        }

        renderGames();
        updateCartBar();
    </script>
</body>
</html>
